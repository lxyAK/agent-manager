<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Manager</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>🤖 Agent Manager</h1>
        <button id="theme-toggle" class="theme-toggle" title="切换主题">☀️</button>
      </div>
      <div class="sidebar-section">
        <div class="section-title">快速启动</div>
        <div id="quick-launch" class="quick-launch-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-title">活动会话</div>
        <div id="session-list" class="session-list"></div>
      </div>
    </aside>

    <!-- Main area -->
    <main id="main-area">
      <div id="tabs-bar" class="tabs-bar"></div>
      <div id="terminal-container" class="terminal-container">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">⚡</div>
          <h2>选择一个 Agent 开始</h2>
          <p>从左侧快速启动栏创建新的会话</p>
        </div>
      </div>
    </main>
  </div>

  <!-- 工作目录选择弹窗 -->
  <div id="cwd-dialog-overlay" class="cwd-dialog-overlay" style="display:none;">
    <div id="cwd-dialog" class="cwd-dialog">
      <div class="cwd-dialog-title">选择工作目录</div>
      <div class="cwd-dialog-desc">为新的代理会话指定工作目录</div>
      <div class="cwd-dialog-actions">
        <button id="cwd-btn-pick" class="cwd-btn cwd-btn-primary">选择目录</button>
        <button id="cwd-btn-default" class="cwd-btn cwd-btn-secondary">直接打开</button>
        <button id="cwd-btn-cancel" class="cwd-btn cwd-btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <script>require('./renderer.js');</script>
</body>
</html>
